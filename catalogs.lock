# NIST's own OSCAL catalogs, from github.com/usnistgov/oscal-content, pinned
# to one commit and to each file's sha256, and the published control-to-test
# matrix this mapping rests on (heyvaldemar/fleet-ops docs/control-evidence.md,
# shown at heyvaldemar.com/evidence). scripts/catalogs.sh downloads them and
# refuses a file whose hash differs. The component definition names each
# catalog by this URL, and scripts/component.py checks that every control it
# maps is in its catalog, by the catalog's own statement id, and that every
# matrix row it names is a row of the matrix.
