# NIST's own OSCAL catalogs, from github.com/usnistgov/oscal-content, pinned
# to one commit and to each file's sha256. scripts/catalogs.sh downloads them
# and refuses a file whose hash differs. The component definition names each
# by this URL, and scripts/component.py checks that every control it maps
# is in its catalog, by the catalog's own statement id.
