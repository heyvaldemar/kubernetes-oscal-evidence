# Which controls the flagship's admission policies carry, and which test proves each.
#
# This file is the mapping, written for a person to read; scripts/component.py
# turns it into the OSCAL component definition in oscal/, and CI fails if
# the two differ. Every control below names the policy that carries it and
# the planted pods that show it working: pods the policy must refuse, and a
# control pod it must admit. A control is claimed only where a policy does
# the work the control's statement asks for, and each says what it leaves
# out. Nothing here is a claim that a system meets a framework.
#
# It rests on the published control-to-test matrix (heyvaldemar/fleet-ops
# docs/control-evidence.md, shown at heyvaldemar.com/evidence): every
# control here names the matrix row it is the machine-readable form of, and
# scripts/component.py refuses a row the pinned matrix does not have. SSDF
# controls are matrix rows themselves; an SP 800-53 or AI RMF control is
# here only where it maps onto a row the matrix already has. The matrix's
# OWASP rows have no OSCAL catalog to point at, so they are named on the
# controls that map onto them, not mapped on their own.
#
# The policies and the planted pods are the flagship's, read from its
# signed release (flagship.lock). The catalogs are NIST's own OSCAL, and
# they and the matrix are pinned by commit and sha256 (catalogs.lock).

# The mapping's own version and date, written into the component definition.
version: 1.1.0
last_modified: "2026-11-01T00:00:00+00:00"

frameworks:
  nist_800_53:
    title: NIST SP 800-53 Rev. 5.2.0
    catalog: NIST_SP-800-53_rev5_catalog.json
  nist_ssdf:
    title: NIST SP 800-218 SSDF v1.1
    catalog: NIST_SP800-218_ver1_catalog.json
  nist_ai_rmf:
    title: NIST AI RMF 1.0 (AI 100-1)
    catalog: NIST_AI-RMF_v1_catalog.json

# The flagship's policies (admission/ in its release). "posture: kyverno"
# means Kyverno's PolicyReports describe the running pods for this policy,
# and C2P turns them into observations. "posture: none" means the reports
# cannot judge it, and the README says why; it is judged by its tests alone.
rules:
  verify-models:
    file: admission/verify-models.yaml
    kind: Kyverno ImageValidatingPolicy
    description: >-
      Model weights are mounted only from the registry inside the boundary,
      by digest, signed with the operator's key, with an AI-BOM attested with
      the same key whose every licence is one the site allows.
    posture: kyverno
  model-volumes:
    file: admission/model-volumes.yaml
    kind: Kubernetes ValidatingAdmissionPolicy
    description: >-
      An image volume in a namespace for verified models names an image
      under the registry's models path, by digest, checked by the API server
      itself, so the rule holds while Kyverno is down.
    posture: kyverno
  carried-images:
    file: admission/carried-images.yaml
    kind: Kubernetes ValidatingAdmissionPolicy
    description: >-
      Every image a pod uses (containers, init and ephemeral containers,
      image volumes) is named by digest, and the digest is one the signed
      bundle carried; kube-system and local-path-storage excepted.
    posture: kyverno
  models-need-kyverno:
    file: admission/kyverno-guard.yaml
    kind: Kubernetes ValidatingAdmissionPolicy
    description: >-
      No model is mounted while Kyverno's webhook for verify-models is
      missing or no longer fails closed.
    posture: kyverno
  egress-node:
    file: admission/egress-node.yaml
    kind: Kubernetes ValidatingAdmissionPolicy
    description: >-
      Only the gateway runs on the egress node: a pod outside its namespace
      may not tolerate the node's taint, tolerate every taint, or name a node
      when it is created.
    posture: none
    # No row of the matrix carries it, so no control here rests on it; its
    # tests still run, and the gate still needs them to pass.
    why: >-
      Its third rule applies only when a pod is created. Kyverno's background
      scan evaluates every stored pod as if it were being created, and every
      pod the scheduler placed names its node, so the report says "fail" for
      pods that broke nothing.

# Every admission test scripts/tests.py records, and what it must show:
# refused by the named policy with the flagship's expected words, or
# admitted. A test the run records and this list does not name fails the
# gate, and so does a test named here that the run did not record.
tests:
  kyverno-away: {outcome: refused, by: [models-need-kyverno]}
  image-by-tag: {outcome: refused, by: [carried-images]}
  image-not-carried: {outcome: refused, by: [carried-images]}
  volume-not-carried: {outcome: refused, by: [carried-images]}
  # Both native policies refuse a model named by tag, and the API server
  # reports one of them: the test holds the layering, and proves no single
  # control.
  model-by-tag: {outcome: refused, by: [carried-images, model-volumes]}
  volume-elsewhere: {outcome: refused, by: [model-volumes]}
  model-unsigned: {outcome: refused, by: [verify-models]}
  model-stranger: {outcome: refused, by: [verify-models]}
  model-nobom: {outcome: refused, by: [verify-models]}
  model-unlicensed: {outcome: refused, by: [verify-models]}
  model-licence-mixed: {outcome: refused, by: [verify-models]}
  model-licence-second: {outcome: refused, by: [verify-models]}
  model-licence-expression: {outcome: refused, by: [verify-models]}
  model-signed: {outcome: admitted}
  model-licence-concluded: {outcome: admitted}
  egress-node-name: {outcome: refused, by: [egress-node]}
  egress-tolerate-all: {outcome: refused, by: [egress-node]}
  egress-toleration: {outcome: refused, by: [egress-node]}
  ordinary-pod: {outcome: admitted}

controls:
  - framework: nist_ssdf
    control: PS.3.2
    matrix: [PS.3.2, "LLM04:2025"]
    rules: [verify-models]
    proven_by: [model-nobom, model-signed]
    implementation: >-
      Models: a CycloneDX 1.6 AI-BOM per model, attested with the operator's
      key and required at admission; a model with none is refused. It names
      each model by publisher, revision and sha256.
    not_covered: >-
      The release archives carry no SBOM, and the flagship's third-party
      images get none (the matrix row says the same).

  - framework: nist_ssdf
    control: PW.4.4
    matrix: [PW.4.4, "LLM03:2025"]
    rules: [verify-models]
    proven_by: [model-unlicensed, model-licence-mixed, model-licence-second, model-licence-expression, model-licence-concluded]
    implementation: >-
      Models: the licence is read from the signed AI-BOM at admission and
      held to the site's list (Apache-2.0, MIT), every model and every
      licence entry, by SPDX id.
    not_covered: >-
      The images half of the matrix row (signature, provenance, SBOM and a
      scan, checked at admission) is kubernetes-supply-chain-admission's;
      here images are held to the bundle's digests, not to those. No check
      for known vulnerabilities in a model.

  - framework: nist_800_53
    control: cm-14
    matrix: ["LLM03:2025"]
    rules: [verify-models, models-need-kyverno]
    proven_by: [model-unsigned, model-stranger, kyverno-away, model-signed]
    implementation: >-
      The model signed with the operator's key, verified offline, by digest,
      before a pod may mount it; and while Kyverno is away and cannot verify,
      the API server's own guard refuses every model mount, so nothing is
      installed unverified.
    not_covered: >-
      Model weights only: container images are held to a list of digests
      (CM-7(5)), not to signatures. The operator's key is a public key
      written into the policy, with no certificate and no transparency log.

  - framework: nist_800_53
    control: si-7
    matrix: ["LLM03:2025", "LLM04:2025"]
    rules: [model-volumes, verify-models]
    proven_by: [volume-elsewhere, model-unsigned, model-stranger, model-signed]
    implementation: >-
      A model is named by digest, so a changed image is a different name;
      its signature is verified before it is mounted, and model weights come
      only from the registry's models path, checked by the API server itself.
    not_covered: >-
      Checked when a pod is admitted. The flagship's policy does not check
      running pods again; here Kyverno re-reads them for its reports, which
      records and refuses nothing.

  - framework: nist_800_53
    control: sr-4
    matrix: [PS.3.2, "LLM04:2025"]
    rules: [verify-models]
    proven_by: [model-nobom, model-signed]
    implementation: >-
      Origins tracked: a model is mounted only with an AI-BOM attested with
      the operator's key that pins it by publisher, revision and sha256.
    not_covered: >-
      Admission checks that the provenance record is there and signed, not
      that it is true of the source, nor where the training data came from.
      Container images carry no provenance check here.

  - framework: nist_800_53
    control: sr-11
    matrix: ["LLM03:2025"]
    rules: [carried-images]
    proven_by: [image-not-carried, volume-not-carried, model-signed]
    implementation: >-
      An image the signed bundle did not carry is refused, whoever made the
      pod and however the image reached the cluster: containers, init and
      ephemeral containers, and image volumes.
    not_covered: >-
      Part (b), reporting counterfeit components to anyone, is not done.
      kube-system and local-path-storage are exempt: their images come with
      the node image.

  - framework: nist_800_53
    control: cm-7.5
    matrix: ["LLM03:2025"]
    rules: [carried-images]
    proven_by: [image-by-tag, image-not-carried, model-signed]
    implementation: >-
      Deny-all, permit-by-exception: the exceptions are the digests the
      signed bundle carried, the policy's parameter. An image named by tag
      alone is refused.
    not_covered: >-
      Part (c), reviewing the list of authorized software, is a person's
      work. kube-system and local-path-storage are exempt.

  - framework: nist_ai_rmf
    control: MANAGE_3.1
    matrix: ["LLM03:2025"]
    rules: [verify-models]
    proven_by: [model-unsigned, model-nobom, model-unlicensed, model-signed]
    implementation: >-
      Third-party models are held to risk controls where they are used:
      signed by the operator, with an attested AI-BOM, under a licence the
      site allows; each refusal names the rule it broke.
    not_covered: >-
      Applied and recorded at admission, not monitored over time; the
      benefits and performance of a third-party model are not assessed here.
